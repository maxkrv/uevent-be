openapi: 3.0.3
info:
  title: Uevent API
  description: |
    API documentation for the Event Sharing Platform (Uevent).

    This API allows users to discover events, purchase tickets, create companies,
    manage events, and interact with other users through comments and notifications.
  version: 1.0.0
  contact:
    name: Uevent Support
    email: support@uevent.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: '{protocol}://{host}/{basePath}'
    variables:
      protocol:
        enum:
          - http
          - https
        default: http
      host:
        default: localhost:3000
      basePath:
        default: api

tags:
  - name: Auth
    description: Authentication operations
  - name: Users
    description: User management operations
  - name: Events
    description: Event operations
  - name: Companies
    description: Company operations
  - name: Tickets
    description: Ticket operations
  - name: Comments
    description: Comment operations
  - name: Categories
    description: Event categories and formats
  - name: Notifications
    description: User notifications
  - name: Files
    description: File upload operations
  - name: Payments
    description: Payment processing

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: 'Bad request'
        timestamp:
          type: string
          format: date-time
        method:
          type: string
          example: 'GET'
        path:
          type: string
          example: '/api/events'

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true

    Tokens:
      type: object
      properties:
        accessToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        refreshToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

    LoginDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'user@example.com'
        password:
          type: string
          format: password
          example: 'Pass123@'

    RegisterDto:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          example: 'user@example.com'
        password:
          type: string
          format: password
          example: 'Pass123@'
        name:
          type: string
          example: 'John Doe'
        bio:
          type: string
          example: 'Event enthusiast'

    ResetPasswordDto:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          format: password
          example: 'NewPass123@'

    EmailDto:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: 'user@example.com'

    User:
      type: object
      properties:
        id:
          type: string
          example: '60d21b4667d0d8992e610c85'
        name:
          type: string
          example: 'John Doe'
        email:
          type: string
          format: email
          example: 'user@example.com'
        avatar:
          type: string
          format: uri
          example: 'https://example.com/avatar.jpg'
        bio:
          type: string
          example: 'Event enthusiast'
        role:
          type: string
          enum: [USER, ADMIN]
          example: 'USER'
        emailVerified:
          type: boolean
          example: true
        showInAttendeeList:
          type: boolean
          example: true
        authProvider:
          type: string
          enum: [EMAIL, GOOGLE]
          example: 'EMAIL'
        eventReminderChannel:
          type: string
          enum: [EMAIL, NONE]
          example: 'EMAIL'
        ticketPurchaseChannel:
          type: string
          enum: [EMAIL, NONE]
          example: 'EMAIL'
        newCommentChannel:
          type: string
          enum: [EMAIL, NONE]
          example: 'EMAIL'
        companyUpdateChannel:
          type: string
          enum: [EMAIL, NONE]
          example: 'EMAIL'

    UpdateUserDto:
      type: object
      properties:
        name:
          type: string
          example: 'John Doe'
        bio:
          type: string
          example: 'Event enthusiast'
        showInAttendeeList:
          type: boolean
          example: true
        newCommentChannel:
          type: string
          enum: [EMAIL, NONE]
          example: 'EMAIL'
        eventReminderChannel:
          type: string
          enum: [EMAIL, NONE]
          example: 'EMAIL'
        companyUpdateChannel:
          type: string
          enum: [EMAIL, NONE]
          example: 'EMAIL'
        ticketPurchaseChannel:
          type: string
          enum: [EMAIL, NONE]
          example: 'EMAIL'

    Company:
      type: object
      properties:
        id:
          type: string
          example: '60d21b4667d0d8992e610c85'
        name:
          type: string
          example: 'Acme Corporation'
        description:
          type: string
          example: 'Leading provider of event solutions'
        email:
          type: string
          format: email
          example: 'info@acme.com'
        website:
          type: string
          format: uri
          example: 'https://acme.com'
        logo:
          type: string
          format: uri
          example: 'https://example.com/logo.jpg'
        address:
          type: string
          example: '123 Main St, City, Country'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ownerId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    CreateCompanyDto:
      type: object
      required:
        - name
        - email
        - address
      properties:
        name:
          type: string
          example: 'Acme Corporation'
        description:
          type: string
          example: 'Leading provider of event solutions'
        email:
          type: string
          format: email
          example: 'info@acme.com'
        website:
          type: string
          format: uri
          example: 'https://acme.com'
        address:
          type: string
          example: '123 Main St, City, Country'

    UpdateCompanyDto:
      type: object
      properties:
        name:
          type: string
          example: 'Acme Corporation'
        description:
          type: string
          example: 'Leading provider of event solutions'
        email:
          type: string
          format: email
          example: 'info@acme.com'
        website:
          type: string
          format: uri
          example: 'https://acme.com'
        address:
          type: string
          example: '123 Main St, City, Country'

    CompanyNews:
      type: object
      properties:
        id:
          type: string
          example: '60d21b4667d0d8992e610c85'
        title:
          type: string
          example: 'New Product Launch'
        content:
          type: string
          example: 'We are excited to announce our new product line...'
        image:
          type: string
          format: uri
          example: 'https://example.com/news.jpg'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        companyId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    CreateCompanyNewsDto:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          example: 'New Product Launch'
        content:
          type: string
          example: 'We are excited to announce our new product line...'

    EventCategory:
      type: object
      properties:
        id:
          type: string
          example: '60d21b4667d0d8992e610c85'
        name:
          type: string
          example: 'Business'
        description:
          type: string
          example: 'Business related events'

    EventFormat:
      type: object
      properties:
        id:
          type: string
          example: '60d21b4667d0d8992e610c85'
        name:
          type: string
          example: 'Conference'
        description:
          type: string
          example: 'Large gathering with presentations'

    Location:
      type: object
      properties:
        address:
          type: string
          example: '123 Main St, City, Country'
        latitude:
          type: number
          format: float
          example: 40.7128
        longitude:
          type: number
          format: float
          example: -74.0060

    Event:
      type: object
      properties:
        id:
          type: string
          example: '60d21b4667d0d8992e610c85'
        title:
          type: string
          example: 'Tech Conference 2023'
        description:
          type: string
          example: 'Annual technology conference with industry leaders'
        poster:
          type: string
          format: uri
          example: 'https://example.com/poster.jpg'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        publishDate:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/Location'
        price:
          type: number
          format: float
          example: 99.99
        maxAttendees:
          type: integer
          example: 500
        currentAttendees:
          type: integer
          example: 250
        showAttendees:
          type: string
          enum: [ALL, ATTENDEES_ONLY]
          example: 'ALL'
        notifyOrganizer:
          type: boolean
          example: true
        redirectUrl:
          type: string
          format: uri
          example: 'https://example.com/thank-you'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        companyId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        company:
          $ref: '#/components/schemas/Company'
        categoryId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        category:
          $ref: '#/components/schemas/EventCategory'
        formatId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        format:
          $ref: '#/components/schemas/EventFormat'
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/User'

    CreateEventDto:
      type: object
      required:
        - title
        - description
        - startDate
        - endDate
        - location
        - companyId
        - categoryId
        - formatId
      properties:
        title:
          type: string
          example: 'Tech Conference 2023'
        description:
          type: string
          example: 'Annual technology conference with industry leaders'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        publishDate:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/Location'
        price:
          type: number
          format: float
          example: 99.99
        maxAttendees:
          type: integer
          example: 500
        showAttendees:
          type: string
          enum: [ALL, ATTENDEES_ONLY]
          example: 'ALL'
        notifyOrganizer:
          type: boolean
          example: true
        redirectUrl:
          type: string
          format: uri
          example: 'https://example.com/thank-you'
        companyId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        categoryId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        formatId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    UpdateEventDto:
      type: object
      properties:
        title:
          type: string
          example: 'Tech Conference 2023'
        description:
          type: string
          example: 'Annual technology conference with industry leaders'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        publishDate:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/Location'
        price:
          type: number
          format: float
          example: 99.99
        maxAttendees:
          type: integer
          example: 500
        showAttendees:
          type: string
          enum: [ALL, ATTENDEES_ONLY]
          example: 'ALL'
        notifyOrganizer:
          type: boolean
          example: true
        redirectUrl:
          type: string
          format: uri
          example: 'https://example.com/thank-you'
        categoryId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        formatId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    EventFilterDto:
      type: object
      properties:
        search:
          type: string
          example: 'tech'
        categoryId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        formatId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        companyId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        minPrice:
          type: number
          format: float
          example: 0
        maxPrice:
          type: number
          format: float
          example: 100
        location:
          type: string
          example: 'New York'

    PromoCode:
      type: object
      properties:
        id:
          type: string
          example: '60d21b4667d0d8992e610c85'
        code:
          type: string
          example: 'SUMMER2023'
        discountPercent:
          type: number
          format: float
          example: 20
        maxUses:
          type: integer
          example: 100
        currentUses:
          type: integer
          example: 45
        expiryDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        eventId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    CreatePromoCodeDto:
      type: object
      required:
        - code
        - discountPercent
        - eventId
      properties:
        code:
          type: string
          example: 'SUMMER2023'
        discountPercent:
          type: number
          format: float
          example: 20
        maxUses:
          type: integer
          example: 100
        expiryDate:
          type: string
          format: date-time
        eventId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    ValidatePromoCodeDto:
      type: object
      required:
        - code
        - eventId
      properties:
        code:
          type: string
          example: 'SUMMER2023'
        eventId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    PromoCodeValidationResult:
      type: object
      properties:
        valid:
          type: boolean
          example: true
        discountPercent:
          type: number
          format: float
          example: 20
        discountedPrice:
          type: number
          format: float
          example: 79.99
        originalPrice:
          type: number
          format: float
          example: 99.99

    Ticket:
      type: object
      properties:
        id:
          type: string
          example: '60d21b4667d0d8992e610c85'
        ticketNumber:
          type: string
          example: 'TICKET-123456'
        purchaseDate:
          type: string
          format: date-time
        price:
          type: number
          format: float
          example: 79.99
        originalPrice:
          type: number
          format: float
          example: 99.99
        status:
          type: string
          enum: [ACTIVE, USED, CANCELLED, REFUNDED]
          example: 'ACTIVE'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        eventId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        event:
          $ref: '#/components/schemas/Event'
        promoCodeId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        promoCode:
          $ref: '#/components/schemas/PromoCode'

    PurchaseTicketDto:
      type: object
      required:
        - eventId
      properties:
        eventId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        promoCode:
          type: string
          example: 'SUMMER2023'

    PaymentIntent:
      type: object
      properties:
        id:
          type: string
          example: 'pi_3NkCFEKb9q6SZIae1Vv5JvF9'
        clientSecret:
          type: string
          example: 'pi_3NkCFEKb9q6SZIae1Vv5JvF9_secret_YWJjMTIzNDU2Nzg5'
        amount:
          type: number
          format: float
          example: 79.99
        currency:
          type: string
          example: 'usd'
        status:
          type: string
          enum:
            [
              requires_payment_method,
              requires_confirmation,
              requires_action,
              processing,
              requires_capture,
              canceled,
              succeeded,
            ]
          example: 'requires_payment_method'

    CreatePaymentIntentDto:
      type: object
      required:
        - ticketId
      properties:
        ticketId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    ConfirmPaymentDto:
      type: object
      required:
        - paymentIntentId
      properties:
        paymentIntentId:
          type: string
          example: 'pi_3NkCFEKb9q6SZIae1Vv5JvF9'

    Comment:
      type: object
      properties:
        id:
          type: string
          example: '60d21b4667d0d8992e610c85'
        content:
          type: string
          example: 'Great event! Looking forward to it.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        user:
          $ref: '#/components/schemas/User'
        eventId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    CreateCommentDto:
      type: object
      required:
        - content
        - eventId
      properties:
        content:
          type: string
          example: 'Great event! Looking forward to it.'
        eventId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    UpdateCommentDto:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: 'Updated: Great event! Looking forward to it.'

    Notification:
      type: object
      properties:
        id:
          type: string
          example: '60d21b4667d0d8992e610c85'
        title:
          type: string
          example: 'Event Reminder'
        content:
          type: string
          example: "Your event 'Tech Conference 2023' starts in 24 hours."
        read:
          type: boolean
          example: false
        type:
          type: string
          enum:
            [
              EVENT_REMINDER,
              NEW_COMMENT,
              COMPANY_UPDATE,
              TICKET_PURCHASE,
              SYSTEM,
            ]
          example: 'EVENT_REMINDER'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        eventId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        event:
          $ref: '#/components/schemas/Event'

    MarkNotificationReadDto:
      type: object
      required:
        - notificationId
      properties:
        notificationId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    Subscription:
      type: object
      properties:
        id:
          type: string
          example: '60d21b4667d0d8992e610c85'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        eventId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        companyId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    SubscribeDto:
      type: object
      properties:
        eventId:
          type: string
          example: '60d21b4667d0d8992e610c85'
        companyId:
          type: string
          example: '60d21b4667d0d8992e610c85'

    PaginationMeta:
      type: object
      properties:
        totalItemsCount:
          type: integer
          example: 100
        itemsPerPage:
          type: integer
          example: 10
        currentPage:
          type: integer
          example: 1

    PaginationOptions:
      type: object
      properties:
        page:
          type: integer
          default: 1
          example: 1
        limit:
          type: integer
          default: 10
          example: 10

    PaginatedEvents:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedCompanies:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedTickets:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedComments:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginatedNotifications:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: Authenticate a user and return access and refresh tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register user
      description: Register a new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      description: Invalidate the refresh token
      operationId: logout
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh tokens
      description: Get new access and refresh tokens using a refresh token
      operationId: refresh
      responses:
        '200':
          description: Tokens successfully refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/activate/{token}:
    post:
      tags:
        - Auth
      summary: Activate account
      description: Activate a user account using the activation token
      operationId: activate
      security: []
      parameters:
        - name: token
          in: path
          required: true
